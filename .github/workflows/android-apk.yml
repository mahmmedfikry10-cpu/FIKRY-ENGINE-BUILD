name: Build FIKRY ENGINE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "FIKRY_ENGINE_V1_AndroidStudio.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Extract Android Studio project
        run: unzip -q FIKRY_ENGINE_V1_AndroidStudio.zip -d .

      - name: Build debug APK
        run: gradle -p FIKRY_ENGINE_V1 --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIKRY-ENGINE-V1-debug-apk
          path: FIKRY_ENGINE_V1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
